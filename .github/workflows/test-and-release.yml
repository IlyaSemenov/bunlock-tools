name: Test and Release

env:
  # Sync with .changeset/config.json:baseBranch
  MAIN_REF: refs/heads/main

on:
  push:
    branches: ["**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Publish to npm with OIDC
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test-and-release:
    name: Test and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.10.17

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Typecheck packages
        run: bun run types

      - name: Test packages
        run: bun run test

      - name: Capture new release versions
        if: ${{ github.ref == env.MAIN_REF }}
        run: |
          if bunx @changesets/cli status --output=release.json; then
            # Changesets also lists dependents with type "none" whose versions stay unchanged.
            echo "CHANGED_PACKAGES=$(jq -r '.releases | map(select(.type != "none") | .name + "@" + .newVersion) | join(", ")' release.json)" >> "$GITHUB_ENV"
          fi
          rm -f release.json

      - name: Create Release Pull Request or Publish to npm
        if: ${{ github.ref == env.MAIN_REF }}
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: npx changeset publish
          title: "Release ${{ env.CHANGED_PACKAGES }}"
          commit: "Release ${{ env.CHANGED_PACKAGES }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bootstrap only. Remove after confirming the initial npm publication.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
